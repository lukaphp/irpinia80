# Pubblica su GitHub Pages: la mappa 2D (file statici nella radice) e la vista 3D (vista3d, compilata con Vite in /3d/).
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vista3d/package-lock.json
      - name: Compila la vista 3D
        working-directory: vista3d
        run: |
          npm ci
          npm run build
      - name: Prepara il sito
        run: |
          mkdir -p _site/3d
          cp index.html style.css data.js app.js audio.mp3 .nojekyll _site/
          cp -r vista3d/dist/. _site/3d/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
